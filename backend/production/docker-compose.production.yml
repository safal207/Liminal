services:
  rgl-core:
    build:
      context: ..
      dockerfile: production/Dockerfile.rgl-core
    expose:
      - "8000"
    environment:
      ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a strong random value}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      USE_REDIS: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      LOG_LEVEL: INFO
      WORKERS: "4"
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  neural-analytics:
    build:
      context: ..
      dockerfile: production/Dockerfile.analytics
    expose:
      - "8001"
    environment:
      RGL_CORE_URL: http://rgl-core:8000
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - rgl-core
      - redis
    networks:
      - internal
    restart: unless-stopped

  websocket-gateway:
    build:
      context: ..
      dockerfile: production/Dockerfile.websocket
    expose:
      - "8002"
    environment:
      RGL_CORE_URL: http://rgl-core:8000
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      MAX_CONNECTIONS: "10000"
    depends_on:
      - rgl-core
      - redis
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to an immutable image digest}
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --maxmemory 512mb
        --maxmemory-policy allkeys-lru --requirepass "$${REDIS_PASSWORD}"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: ${NEO4J_IMAGE:?Set NEO4J_IMAGE to an immutable image digest}
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_db_memory_pagecache_size: 512M
      NEO4J_db_memory_heap_initial_size: 512M
      NEO4J_db_memory_heap_max_size: 1G
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set PROMETHEUS_IMAGE to an immutable image digest}
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - internal
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:?Set GRAFANA_IMAGE to an immutable image digest}
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to an immutable image digest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - rgl-core
      - neural-analytics
      - websocket-gateway
    networks:
      - edge
      - internal
    restart: unless-stopped

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:?Set ELASTICSEARCH_IMAGE to an immutable image digest}
    expose:
      - "9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - internal
    restart: unless-stopped

  logstash:
    image: ${LOGSTASH_IMAGE:?Set LOGSTASH_IMAGE to an immutable image digest}
    volumes:
      - ./monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD}
    depends_on:
      - elasticsearch
    networks:
      - internal
    restart: unless-stopped

  kibana:
    image: ${KIBANA_IMAGE:?Set KIBANA_IMAGE to an immutable image digest}
    expose:
      - "5601"
    environment:
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD}
    depends_on:
      - elasticsearch
    networks:
      - internal
    restart: unless-stopped

volumes:
  redis-data:
  neo4j-data:
  neo4j-logs:
  prometheus-data:
  grafana-data:
  elasticsearch-data:

networks:
  edge:
  internal:
    internal: true
