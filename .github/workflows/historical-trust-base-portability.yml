name: Historical Trust-Base Portability v0.1

on:
  workflow_call:
  workflow_dispatch:

jobs:
  produce-primary-root-a:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: safal207/Liminal/.github/workflows/trusted-recovery-trust-root-rotation-drill.yml@e2cb6a014236bc561d03c405f4986146026041fa

  prove-historical-trust-base-portability:
    needs: produce-primary-root-a
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable historical portability verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0

      - name: Verify immutable historical portability checkout
        env:
          LIMINAL_HISTORY_REPOSITORY: ${{ job.workflow_repository }}
          LIMINAL_HISTORY_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${LIMINAL_HISTORY_WORKFLOW_SHA}" || {
            echo "historical portability checkout mismatch"
            exit 1
          }

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download fresh Root A rotation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-recovery-trust-root-rotation-drill
          path: primary-root-a

      - name: Verify immutable Root A rotation signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            primary-root-a/rotation-drill-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-trust-root-rotation-drill.yml \
            --signer-digest e2cb6a014236bc561d03c405f4986146026041fa \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > primary-root-a-attestation-verification.json

      - name: Reconstruct independent Root A and Root B histories
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          LIMINAL_HISTORY_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python scripts/verify-historical-trust-base-portability-v0-1.py \
            --primary-rotation-dir primary-root-a \
            --primary-baseline-registry policies/recovery-trust-root-registry-v0.1.json \
            --primary-baseline-manifest policies/recovery-trust-root-manifest-v0.1.json \
            --primary-attestation primary-root-a-attestation-verification.json \
            --root-b-dir trust/experimental/historical-root-b-v0.1 \
            --rotation-contract policies/portable-rotation-producer-contract-v0.1.json \
            --authorization-contract policies/portable-rotation-authorization-contract-v0.1.json \
            --repository-root "${GITHUB_WORKSPACE}" \
            --workflow-sha "${LIMINAL_HISTORY_WORKFLOW_SHA}" \
            --output-dir artifacts/historical-trust-base-portability

      - name: Assert portable-history verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "artifacts/historical-trust-base-portability/"
              "historical-trust-base-portability-result.json"
          )
          result = json.loads(path.read_text())
          assert result["verified"] is True
          assert result["reason"] == "historical_trust_base_portability_verified"
          assert result["primary"]["attestation_verified"] is True
          assert result["secondary"]["signature_verified"] is True
          assert result["secondary"]["source_material_verified"] is True
          assert result["receipt"]["histories_independently_valid"] is True
          assert result["receipt"]["cross_root_dependency"] is False
          assert result["receipt"]["equivalent_terminal_state"] is True
          assert (
              result["receipt"]["genesis_a_manifest_sha256"]
              != result["receipt"]["genesis_b_manifest_sha256"]
          )
          assert (
              result["receipt"]["history_a_tip_sha256"]
              != result["receipt"]["history_b_tip_sha256"]
          )
          assert (
              result["receipt"]["trust_state_digest_a"]
              == result["receipt"]["trust_state_digest_b"]
          )
          print("historical_trust_base_portability=VERIFIED")
          PY

      - name: Attest historical portability result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/historical-trust-base-portability/historical-trust-base-portability-result.json

      - name: Upload historical portability proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: historical-trust-base-portability-proof-v0.1
          path: artifacts/historical-trust-base-portability
          if-no-files-found: error
          retention-days: 30
