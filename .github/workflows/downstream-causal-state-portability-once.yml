name: Downstream Causal-State Portability Once

on:
  push:
    branches:
      - agent/recovery-routing-v0-1
    paths:
      - .github/workflows/downstream-causal-state-portability-once.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  prove:
    uses: safal207/Liminal/.github/workflows/downstream-causal-state-portability.yml@65140882f172c53b6556ce9aa7a190f40bacc3bf

  audit-independently:
    needs: prove
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable downstream portability verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: safal207/Liminal
          ref: 65140882f172c53b6556ce9aa7a190f40bacc3bf
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download downstream causal-state proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: downstream-causal-state-portability-proof-v0.1
          path: proof

      - name: Verify immutable downstream proof signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            proof/downstream-causal-state-portability-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/downstream-causal-state-portability.yml \
            --signer-digest 65140882f172c53b6556ce9aa7a190f40bacc3bf \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > downstream-result-attestation-verification.json

      - name: Reverify bundled historical proof signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            proof/materials/historical-proof/historical-trust-base-portability-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/historical-trust-base-portability.yml \
            --signer-digest 64116d0eea55a874ac7f63b733416df39108d7a7 \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > historical-result-attestation-verification.json

      - name: Independently recompute downstream causal state
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python scripts/audit-downstream-causal-state-portability-v0-1.py \
            --proof-dir proof \
            --output audit/downstream-causal-state-portability-external-audit.json

      - name: Assert independent audit verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(
              Path(
                  "audit/downstream-causal-state-portability-external-audit.json"
              ).read_text()
          )
          assert audit["verified"] is True
          assert audit["reason"] == "downstream_causal_state_portability_recomputed"
          assert audit["raw_history_embedded"] is False
          print("downstream_causal_state_external_audit=VERIFIED")
          PY

      - name: Attest independent audit result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: audit/downstream-causal-state-portability-external-audit.json

      - name: Upload independent audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: downstream-causal-state-portability-external-audit-v0.1
          path: |
            audit
            downstream-result-attestation-verification.json
            historical-result-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
