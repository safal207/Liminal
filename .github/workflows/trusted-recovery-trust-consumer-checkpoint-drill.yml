name: Trusted Recovery Trust Consumer Checkpoint Drill v0.1

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run-and-attest-consumer-checkpoint-drill:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable checkpoint drill source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0

      - name: Verify immutable checkpoint drill checkout
        env:
          LIMINAL_CHECKPOINT_DRILL_REPOSITORY: ${{ job.workflow_repository }}
          LIMINAL_CHECKPOINT_DRILL_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${LIMINAL_CHECKPOINT_DRILL_WORKFLOW_SHA}" || {
            echo "checkpoint drill checkout mismatch: ${actual_sha} != ${LIMINAL_CHECKPOINT_DRILL_WORKFLOW_SHA}"
            exit 1
          }

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Run consumer checkpoint advance and stale-registry drill
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python scripts/run-recovery-trust-consumer-checkpoint-drill.py \
            --checkpoint policies/recovery-trust-consumer-checkpoint-v0.1.json \
            --registry policies/recovery-trust-root-registry-v0.1.json \
            --manifest policies/recovery-trust-root-manifest-v0.1.json \
            --output-dir artifacts/trust-consumer-checkpoint-drill

      - name: Assert machine-readable checkpoint verdicts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifacts/trust-consumer-checkpoint-drill/consumer-checkpoint-drill-result.json").read_text()
          )
          assert result["verified"] is True
          assert result["external_provider_calls"] == 0
          assert result["permanent_registry_mutated"] is False
          assert result["permanent_checkpoint_mutated"] is False
          assert result["advance"]["authorized"] is True
          assert result["advance"]["reason"] == "consumer_checkpoint_advanced"
          assert result["advance"]["accepted_generation"] == 1
          assert result["stale_replay"]["structurally_valid"] is True
          assert result["stale_replay"]["authorized"] is False
          assert result["stale_replay"]["reason"] == "stale_registry"
          print("consumer_checkpoint_advance=AUTHORIZED")
          print("old_registry_replay=REJECT:stale_registry")
          PY

      - name: Attest consumer checkpoint drill result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/trust-consumer-checkpoint-drill/consumer-checkpoint-drill-result.json

      - name: Upload consumer checkpoint drill evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-recovery-trust-consumer-checkpoint-drill
          path: artifacts/trust-consumer-checkpoint-drill
          if-no-files-found: error
          retention-days: 30
