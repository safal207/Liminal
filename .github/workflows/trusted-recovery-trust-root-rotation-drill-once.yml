name: Trusted Recovery Trust Root Rotation Drill Once

on:
  push:
    branches:
      - agent/recovery-routing-v0-1
    paths:
      - '.github/workflows/trusted-recovery-trust-root-rotation-drill-once.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  run-immutable-rotation-drill:
    uses: safal207/Liminal/.github/workflows/trusted-recovery-trust-root-rotation-drill.yml@b737b1d0a0833c9739be5f642679eded423e534b

  verify-rotation-drill-externally:
    needs: run-immutable-rotation-drill
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Download immutable rotation drill evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-recovery-trust-root-rotation-drill
          path: trust-root-rotation-drill

      - name: Assert rotation and downgrade verdicts externally
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("trust-root-rotation-drill/rotation-drill-result.json")
          raw = path.read_bytes()
          result = json.loads(raw)
          assert result["verified"] is True
          assert result["external_provider_calls"] == 0
          assert result["baseline"]["active_generation"] == 0
          assert result["legitimate_rotation"]["generation"] == 1
          assert result["legitimate_rotation"]["authorized"] is True
          assert result["legitimate_rotation"]["reason"] == "registry_rotation_authorized"
          assert result["legitimate_rotation"]["workflow_blob_unchanged"] is True
          assert result["downgrade_attempt"]["generation"] == 2
          assert result["downgrade_attempt"]["structurally_valid"] is True
          assert result["downgrade_attempt"]["authorized"] is False
          assert result["downgrade_attempt"]["reason"] == "verifier_root_downgrade"
          print(f"rotation_drill_result_sha256={hashlib.sha256(raw).hexdigest()}")
          print("gen0_to_gen1=AUTHORIZED:registry_rotation_authorized")
          print("gen1_to_gen2=REJECT:verifier_root_downgrade")
          PY

      - name: Verify immutable rotation drill attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            trust-root-rotation-drill/rotation-drill-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-trust-root-rotation-drill.yml \
            --signer-digest b737b1d0a0833c9739be5f642679eded423e534b \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > trust-root-rotation-drill/rotation-drill-attestation-verification.json

      - name: Upload external rotation drill verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-recovery-trust-root-rotation-drill-external-verification
          path: trust-root-rotation-drill/rotation-drill-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
