name: Live OpenAI Provider Trace Once

on:
  push:
    branches:
      - agent/recovery-routing-v0-1
    paths:
      - .github/workflows/live-provider-trace-once.yml

permissions:
  contents: read

jobs:
  live-provider-trace:
    runs-on: ubuntu-latest
    environment: live-provider-trace
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MOCK_ONLY: "false"
      OPENAI_FALLBACK_TO_LOCAL: "false"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require live provider secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY GitHub Secret is required; repository .env files are never used."
            exit 1
          fi

      - name: Install minimal live-trace dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai>=1.30,<3" "httpx>=0.24" "structlog>=23.1"

      - name: Run nominal live provider trace
        run: |
          python scripts/run-live-provider-trace.py \
            --model "gpt-4.1-mini" \
            --context-window-tokens "1047576" \
            --probe-mode "nominal" \
            --latency-budget-seconds "10" \
            --output artifacts/live-provider-trace.json

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-trace-once
          path: artifacts/live-provider-trace.json
          if-no-files-found: warn
          retention-days: 14
