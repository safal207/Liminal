name: Historical Root B Bootstrap Builder v0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  describe-bootstrap-root:
    runs-on: ubuntu-24.04
    steps:
      - name: Emit Root B bootstrap identity
        run: |
          set -euo pipefail
          echo "trust_domain=liminal.trusted-recovery"
          echo "root=historical-root-b"
          echo "role=bootstrap-builder"
          echo "authority=external-ed25519"
