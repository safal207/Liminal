name: Trusted Recovery Trust Root Rotation Drill Once

on:
  push:
    branches:
      - agent/recovery-routing-v0-1
    paths:
      - '.github/workflows/trusted-recovery-trust-root-rotation-drill-once.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  run-immutable-rotation-drill:
    uses: safal207/Liminal/.github/workflows/trusted-recovery-trust-root-rotation-drill.yml@e2cb6a014236bc561d03c405f4986146026041fa

  verify-rotation-drill-externally:
    needs: run-immutable-rotation-drill
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Download rotation drill evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-recovery-trust-root-rotation-drill
          path: rotation-drill-evidence

      - name: Assert machine-readable authorized rotation and rejected downgrade
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('rotation-drill-evidence/rotation-drill-result.json')
          result = json.loads(path.read_text())
          assert result['verified'] is True
          assert result['external_provider_calls'] == 0
          assert result['legitimate_rotation']['authorized'] is True
          assert result['legitimate_rotation']['reason'] == 'registry_rotation_authorized'
          assert result['legitimate_rotation']['workflow_blob_unchanged'] is True
          assert result['downgrade_attempt']['structurally_valid'] is True
          assert result['downgrade_attempt']['authorized'] is False
          assert result['downgrade_attempt']['reason'] == 'verifier_root_downgrade'
          print('legitimate_rotation=AUTHORIZED')
          print('downgrade_attempt=REJECT:verifier_root_downgrade')
          PY

      - name: Verify immutable rotation drill signer with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            rotation-drill-evidence/rotation-drill-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-trust-root-rotation-drill.yml \
            --signer-digest e2cb6a014236bc561d03c405f4986146026041fa \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > rotation-drill-evidence/rotation-drill-attestation-verification.json

      - name: Upload external drill verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-recovery-trust-root-rotation-drill-external-verification
          path: rotation-drill-evidence/rotation-drill-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
