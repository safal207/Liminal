name: Repeated Causal Fork Branch A Producer v0.1

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  produce-branch-a:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable repeated Branch A producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0

      - name: Verify immutable repeated Branch A producer checkout
        env:
          LIMINAL_REPEAT_BRANCH_A_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${LIMINAL_REPEAT_BRANCH_A_WORKFLOW_SHA}"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download predecessor fork reconciliation proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: causal-fork-reconciliation-portability-proof-v0.1
          path: predecessor

      - name: Verify immutable predecessor signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            predecessor/causal-fork-reconciliation-portability-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/causal-fork-reconciliation-portability.yml \
            --signer-digest 51894987f038e6c24fadf5b3c2768feda4117d6f \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > predecessor-attestation-verification.json

      - name: Produce repeated Branch A evidence
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          LIMINAL_REPEAT_BRANCH_A_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python scripts/produce-repeated-causal-fork-branch-a-v0-1.py \
            --predecessor-proof-dir predecessor \
            --branch-a-policy policies/portable-repeated-causal-fork-state-a-v0.1.json \
            --branch-b-policy policies/portable-repeated-causal-fork-state-b-v0.1.json \
            --reconciliation-policy policies/portable-repeated-causal-reconciled-state-v0.1.json \
            --branch-contract policies/portable-repeated-causal-fork-branch-contract-v0.1.json \
            --branch-authorization-contract policies/portable-repeated-causal-fork-authorization-contract-v0.1.json \
            --reconciliation-contract policies/portable-repeated-causal-reconciliation-contract-v0.1.json \
            --reconciliation-authorization-contract policies/portable-repeated-causal-reconciliation-authorization-contract-v0.1.json \
            --lineage-compaction-contract policies/portable-causal-lineage-compaction-contract-v0.1.json \
            --workflow-sha "${LIMINAL_REPEAT_BRANCH_A_WORKFLOW_SHA}" \
            --output-dir branch-a

      - name: Assert repeated Branch A evidence verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("branch-a/repeated-causal-fork-branch-a-result.json").read_text()
          )
          assert result["verified"] is True
          assert result["reason"] == "repeated_causal_fork_branch_a_evidence_verified"
          assert result["branch_checkpoint"]["state_ref"]["causal_epoch"] == 5
          assert result["branch_observation"]["logical_branch_id"] == "authorization-policy-repeat-fork-a"
          assert result["claim_boundary"]["predecessor_is_reconciled_dag_tip"] is True
          print("repeated_causal_fork_branch_a=VERIFIED")
          PY

      - name: Attest repeated Branch A result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: branch-a/repeated-causal-fork-branch-a-result.json

      - name: Upload repeated Branch A evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repeated-causal-fork-branch-a-evidence-v0.1
          path: |
            branch-a
            predecessor-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
