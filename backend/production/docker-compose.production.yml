services:
  rgl-core:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Set PYTHON_IMAGE to an immutable python image reference}
    expose:
      - "8000"
    environment:
      ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a strong random value}
      ML_METRICS_SERVICE_TOKEN: ${ML_METRICS_SERVICE_TOKEN:?Set a strong ML metrics service token}
      LIMINAL_ADMIN_PASS: ${LIMINAL_ADMIN_PASS:?Set LIMINAL_ADMIN_PASS to a strong bootstrap password}
      REDIS_URL: "rediss://redis:6379/0?ssl_cert_reqs=required&ssl_ca_certs=/etc/liminal/tls/redis-ca.crt"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      USE_REDIS: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      LOG_LEVEL: INFO
      WORKERS: "4"
      WS_MAX_MESSAGE_BYTES: ${WS_MAX_MESSAGE_BYTES:-16384}
      # Only the ingress container at this fixed internal address may supply
      # forwarded client identity to Uvicorn.
      FORWARDED_ALLOW_IPS: "172.30.0.10"
    volumes:
      - ${LIMINAL_TLS_CERT_DIR:?Set LIMINAL_TLS_CERT_DIR}/redis/ca.crt:/etc/liminal/tls/redis-ca.crt:ro
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis@${REDIS_IMAGE_DIGEST:?Set REDIS_IMAGE_DIGEST to sha256 digest}
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ${LIMINAL_TLS_CERT_DIR:?Set LIMINAL_TLS_CERT_DIR}/redis:/etc/liminal/tls:ro
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --maxmemory 512mb
        --maxmemory-policy allkeys-lru --requirepass "$${REDIS_PASSWORD}"
        --port 0 --tls-port 6379
        --tls-cert-file /etc/liminal/tls/server.crt
        --tls-key-file /etc/liminal/tls/server.key
        --tls-ca-cert-file /etc/liminal/tls/ca.crt
        --tls-auth-clients no
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --tls --cacert /etc/liminal/tls/ca.crt -a \"$${REDIS_PASSWORD}\" ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j@${NEO4J_IMAGE_DIGEST:?Set NEO4J_IMAGE_DIGEST to sha256 digest}
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_db_memory_pagecache_size: 512M
      NEO4J_db_memory_heap_initial_size: 512M
      NEO4J_db_memory_heap_max_size: 1G
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  nginx:
    image: nginx@${NGINX_IMAGE_DIGEST:?Set NGINX_IMAGE_DIGEST to sha256 digest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - rgl-core
    networks:
      edge:
      internal:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

volumes:
  redis-data:
  neo4j-data:
  neo4j-logs:

networks:
  edge:
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
