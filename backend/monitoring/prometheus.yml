global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s

  - job_name: "liminal-backend"
    static_configs:
      - targets: ["rgl-core:8000"]
    scrape_interval: 5s
    metrics_path: "/metrics"
    scrape_timeout: 5s
