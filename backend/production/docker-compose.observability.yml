# Add this file explicitly to enable the optional observability services. The
# base ingress deliberately contains no references to these service hostnames.
services:
  nginx:
    volumes:
      - ../nginx/observability.conf:/etc/nginx/liminal.d/observability.conf:ro
    depends_on:
      - prometheus
      - grafana

  prometheus:
    image: prom/prometheus@${PROMETHEUS_IMAGE_DIGEST:?Set PROMETHEUS_IMAGE_DIGEST to sha256 digest}
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana@${GRAFANA_IMAGE_DIGEST:?Set GRAFANA_IMAGE_DIGEST to sha256 digest}
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - internal
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch@${ELASTICSEARCH_IMAGE_DIGEST:?Set ELASTICSEARCH_IMAGE_DIGEST to sha256 digest}
    expose:
      - "9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "true"
      # Security auto-configuration is skipped when xpack.security.enabled is explicit.
      # Keep the authenticated HTTP endpoint confined to the internal network.
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:\"$${ELASTIC_PASSWORD}\" http://localhost:9200/_cluster/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch@${ELASTICSEARCH_IMAGE_DIGEST:?Set ELASTICSEARCH_IMAGE_DIGEST to sha256 digest}
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      - bash
      - -euc
      - |
        escaped="$${KIBANA_SYSTEM_PASSWORD//\\/\\\\}"
        escaped="$${escaped//\"/\\\"}"
        printf '{"password":"%s"}' "$${escaped}" |
          curl -fsS --output /dev/null \
            --user "elastic:$${ELASTIC_PASSWORD}" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data-binary @- \
            http://elasticsearch:9200/_security/user/kibana_system/_password
    networks:
      - internal
    restart: "no"

  logstash:
    image: docker.elastic.co/logstash/logstash@${LOGSTASH_IMAGE_DIGEST:?Set LOGSTASH_IMAGE_DIGEST to sha256 digest}
    volumes:
      - ./monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD}
    depends_on:
      - elasticsearch
    networks:
      - internal
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana@${KIBANA_IMAGE_DIGEST:?Set KIBANA_IMAGE_DIGEST to sha256 digest}
    expose:
      - "5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - internal
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
