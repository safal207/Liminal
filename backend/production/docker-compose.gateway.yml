# Add this file explicitly to enable the optional WebSocket gateway. Its image
# identity is required only when the override is selected.
services:
  websocket-gateway:
    image: ${WEBSOCKET_GATEWAY_IMAGE_REPOSITORY:?Set repository}@${WEBSOCKET_GATEWAY_IMAGE_DIGEST:?Set sha256 digest}
    expose:
      - "8002"
    environment:
      RGL_CORE_URL: http://rgl-core:8000
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      MAX_CONNECTIONS: "10000"
    depends_on:
      - rgl-core
      - redis
    networks:
      - internal
    restart: unless-stopped
