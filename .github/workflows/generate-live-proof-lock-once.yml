name: Generate Live Proof Wheel Hash Closure Once

on:
  push:
    branches:
      - agent/recovery-routing-v0-1
    paths:
      - '.github/workflows/generate-live-proof-lock-once.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'

      - name: Download exact validated dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/live-proof-lock/wheels
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --dest artifacts/live-proof-lock/wheels \
            'annotated-types==0.8.0' \
            'anyio==4.14.2' \
            'certifi==2026.7.22' \
            'cffi==2.1.1' \
            'cryptography==50.0.0' \
            'distro==1.9.0' \
            'h11==0.16.0' \
            'httpcore==1.0.9' \
            'httpx==0.28.1' \
            'idna==3.18' \
            'jiter==0.16.0' \
            'openai==2.53.0' \
            'pycparser==3.0' \
            'pydantic==2.13.4' \
            'pydantic-core==2.46.4' \
            'sniffio==1.3.1' \
            'structlog==26.1.0' \
            'tqdm==4.70.0' \
            'typing-extensions==4.16.0' \
            'typing-inspection==0.4.3'

      - name: Record wheel SHA-256 closure
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/live-proof-lock/wheels
          sha256sum *.whl | sort | tee ../wheel-hashes.txt
          printf 'python=%s\n' "$(python --version 2>&1)" > ../builder-environment.txt
          printf 'runner_os=%s\n' "${RUNNER_OS}" >> ../builder-environment.txt
          printf 'runner_arch=%s\n' "${RUNNER_ARCH}" >> ../builder-environment.txt
          printf 'image_os=%s\n' "${ImageOS:-unknown}" >> ../builder-environment.txt
          printf 'image_version=%s\n' "${ImageVersion:-unknown}" >> ../builder-environment.txt

      - name: Upload hash closure artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-proof-wheel-hash-closure
          path: |
            artifacts/live-proof-lock/wheel-hashes.txt
            artifacts/live-proof-lock/builder-environment.txt
          if-no-files-found: error
          retention-days: 7
