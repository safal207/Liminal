name: Normalized Verification Receipt Proof v0.1

on:
  workflow_call:
  workflow_dispatch:

jobs:
  produce-attested-checkpoint:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: safal207/Liminal/.github/workflows/trusted-recovery-trust-consumer-checkpoint-attested.yml@f31b56a5e21a668bcb98791b05542652760dcc27

  prove-normalized-verification-receipt:
    needs: produce-attested-checkpoint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable normalized-receipt source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0

      - name: Verify immutable normalized-receipt checkout
        env:
          LIMINAL_NORMALIZED_RECEIPT_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${LIMINAL_NORMALIZED_RECEIPT_WORKFLOW_SHA}" || {
            echo "normalized-receipt checkout mismatch: ${actual_sha} != ${LIMINAL_NORMALIZED_RECEIPT_WORKFLOW_SHA}"
            exit 1
          }

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download immutable producer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-recovery-trust-consumer-checkpoint-attested
          path: source-evidence

      - name: Locate unique producer subjects
        id: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path("source-evidence")
          manifests = sorted(root.rglob("evidence-manifest-v0.1.json"))
          checkpoints = sorted(root.rglob("checkpoint-generation-1.json"))
          assert len(manifests) == 1, manifests
          assert len(checkpoints) == 1, checkpoints
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"manifest={manifests[0].as_posix()}\n")
              output.write(f"checkpoint={checkpoints[0].as_posix()}\n")
          print(f"source_manifest={manifests[0]}")
          print(f"source_checkpoint={checkpoints[0]}")
          PY

      - name: Capture real producer verification for manifest
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ steps.source.outputs.manifest }}
        run: |
          set -euo pipefail
          mkdir -p verifier-capture-a
          gh attestation verify \
            "${MANIFEST_PATH}" \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-trust-consumer-checkpoint-attested.yml \
            --signer-digest f31b56a5e21a668bcb98791b05542652760dcc27 \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > verifier-capture-a/manifest.json

      - name: Capture real producer verification for checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_PATH: ${{ steps.source.outputs.checkpoint }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "${CHECKPOINT_PATH}" \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-trust-consumer-checkpoint-attested.yml \
            --signer-digest f31b56a5e21a668bcb98791b05542652760dcc27 \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > verifier-capture-a/checkpoint.json

      - name: Materialize byte-distinct alternate audit captures
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("verifier-capture-a")
          target = Path("verifier-capture-b")
          target.mkdir(parents=True, exist_ok=True)

          for name in ("manifest", "checkpoint"):
              payload = json.loads((source / f"{name}.json").read_text())
              alternate = {
                  "capture_schema": "liminal.verifier-audit-envelope/v0.1",
                  "representation": "alternate-byte-layout-same-verification-event",
                  "security_semantics_authoritative": False,
                  "provider_payload": payload,
              }
              (target / f"{name}.json").write_text(
                  json.dumps(alternate, indent=2, sort_keys=True) + "\n"
              )
          PY

      - name: Normalize receipts and prove Evidence Bundle v0.2 equivalence
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          SOURCE_MANIFEST: ${{ steps.source.outputs.manifest }}
          SOURCE_CHECKPOINT: ${{ steps.source.outputs.checkpoint }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from liminal.evidence_bundle_v2 import (
              build_receipt_backed_evidence_bundle,
              canonical_receipt_backed_evidence_bundle_bytes,
              receipt_backed_evidence_bundle_sha256,
          )
          from liminal.evidence_manifest import (
              canonical_manifest_bytes,
              parse_manifest_bytes,
          )
          from liminal.recovery_trust_consumer_checkpoint_attested import checkpoint_sha256
          from liminal.recovery_trust_consumer_checkpoint_witness import (
              VerifiedCheckpointEvidence,
              evaluate_checkpoint_candidate,
              validate_witness,
              witness_sha256,
          )
          from liminal.recovery_trust_root_registry import canonical_json_bytes
          from liminal.verification_receipt import (
              build_normalized_verification_receipt,
              canonical_verification_receipt_bytes,
              verification_receipt_sha256,
          )

          logical_id = "trust-consumer-checkpoint:generation-1"
          generation = 1
          repository = "safal207/Liminal"
          signer_workflow = (
              "safal207/Liminal/.github/workflows/"
              "trusted-recovery-trust-consumer-checkpoint-attested.yml"
          )
          signer_sha = "f31b56a5e21a668bcb98791b05542652760dcc27"
          source_ref = os.environ["SOURCE_REF"]

          manifest_raw = Path(os.environ["SOURCE_MANIFEST"]).read_bytes()
          checkpoint_raw = Path(os.environ["SOURCE_CHECKPOINT"]).read_bytes()
          manifest = parse_manifest_bytes(manifest_raw)
          assert canonical_manifest_bytes(manifest) == manifest_raw
          manifest_sha = hashlib.sha256(manifest_raw).hexdigest()
          checkpoint_sha = hashlib.sha256(checkpoint_raw).hexdigest()

          raw_hashes = {}
          for capture in ("a", "b"):
              for subject in ("manifest", "checkpoint"):
                  path = Path(f"verifier-capture-{capture}/{subject}.json")
                  raw_hashes[f"{capture}_{subject}"] = hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
          assert raw_hashes["a_manifest"] != raw_hashes["b_manifest"]
          assert raw_hashes["a_checkpoint"] != raw_hashes["b_checkpoint"]

          receipts_dir = Path("artifacts/normalized-verification-receipt-proof/receipts")
          receipts_dir.mkdir(parents=True, exist_ok=True)
          bundles_dir = Path("artifacts/normalized-verification-receipt-proof/bundles")
          bundles_dir.mkdir(parents=True, exist_ok=True)

          manifest_receipt_hashes = []
          checkpoint_receipt_hashes = []
          bundle_hashes = []
          bundle_objects = []

          for capture in ("a", "b"):
              manifest_receipt = build_normalized_verification_receipt(
                  verification_scheme="github_attestation",
                  subject_sha256=manifest_sha,
                  repository=repository,
                  signer_workflow=signer_workflow,
                  signer_digest=signer_sha,
                  source_ref=source_ref,
                  deny_self_hosted_runners=True,
                  verification_succeeded=True,
              )
              checkpoint_receipt = build_normalized_verification_receipt(
                  verification_scheme="github_attestation",
                  subject_sha256=checkpoint_sha,
                  repository=repository,
                  signer_workflow=signer_workflow,
                  signer_digest=signer_sha,
                  source_ref=source_ref,
                  deny_self_hosted_runners=True,
                  verification_succeeded=True,
              )
              manifest_receipt_path = receipts_dir / f"manifest-receipt-{capture}.json"
              checkpoint_receipt_path = receipts_dir / f"checkpoint-receipt-{capture}.json"
              manifest_receipt_path.write_bytes(
                  canonical_verification_receipt_bytes(manifest_receipt)
              )
              checkpoint_receipt_path.write_bytes(
                  canonical_verification_receipt_bytes(checkpoint_receipt)
              )
              manifest_receipt_hashes.append(
                  verification_receipt_sha256(manifest_receipt)
              )
              checkpoint_receipt_hashes.append(
                  verification_receipt_sha256(checkpoint_receipt)
              )

              bundle = build_receipt_backed_evidence_bundle(
                  manifest,
                  logical_id=logical_id,
                  generation=generation,
                  manifest_receipt=manifest_receipt,
                  evidence_receipt=checkpoint_receipt,
              )
              bundle_path = bundles_dir / f"evidence-bundle-v0.2-{capture}.json"
              bundle_path.write_bytes(
                  canonical_receipt_backed_evidence_bundle_bytes(bundle)
              )
              bundle_hashes.append(receipt_backed_evidence_bundle_sha256(bundle))
              bundle_objects.append(bundle)

          assert manifest_receipt_hashes[0] == manifest_receipt_hashes[1]
          assert checkpoint_receipt_hashes[0] == checkpoint_receipt_hashes[1]
          assert bundle_hashes[0] == bundle_hashes[1]
          assert bundle_objects[0] == bundle_objects[1]

          witness_root = json.loads(
              Path("policies/recovery-trust-consumer-checkpoint-witness-v0.2.json").read_text()
          )
          baseline_checkpoint = json.loads(
              Path("policies/recovery-trust-consumer-checkpoint-v0.2.json").read_text()
          )
          assert validate_witness(witness_root)
          verified_checkpoint = VerifiedCheckpointEvidence(
              verified=True,
              signer_workflow_path=signer_workflow.replace("safal207/Liminal/", ""),
              signer_workflow_sha=signer_sha,
              subject_sha256=checkpoint_sha,
          )
          candidate = json.loads(checkpoint_raw)
          assert checkpoint_sha256(candidate) == checkpoint_sha
          witness_decisions = []
          for capture in ("a", "b"):
              decision = evaluate_checkpoint_candidate(
                  witness_root,
                  candidate,
                  previous_checkpoint=baseline_checkpoint,
                  checkpoint_evidence=verified_checkpoint,
              )
              assert decision.authorized is True, decision.reason
              assert decision.reason == "checkpoint_witness_advanced"
              assert decision.next_witness is not None
              witness_decisions.append(
                  {
                      "capture": capture,
                      "authorized": decision.authorized,
                      "reason": decision.reason,
                      "next_witness_sha256": witness_sha256(decision.next_witness),
                  }
              )
          assert witness_decisions[0]["reason"] == witness_decisions[1]["reason"]
          assert (
              witness_decisions[0]["next_witness_sha256"]
              == witness_decisions[1]["next_witness_sha256"]
          )

          result = {
              "schema_version": "liminal.normalized-verification-receipt-proof.v0.1",
              "verified": True,
              "reason": "verification_output_representation_independence_verified",
              "claim_boundary": (
                  "same successful github-attestation verification event; "
                  "not an independent second verifier"
              ),
              "logical_id": logical_id,
              "generation": generation,
              "manifest_sha256": manifest_sha,
              "checkpoint_sha256": checkpoint_sha,
              "raw_capture_sha256": raw_hashes,
              "normalized_receipt_sha256": {
                  "manifest": manifest_receipt_hashes[0],
                  "checkpoint": checkpoint_receipt_hashes[0],
              },
              "evidence_bundle_v0_2_sha256": bundle_hashes[0],
              "witness_decisions": witness_decisions,
              "equivalence": {
                  "manifest_raw_captures_distinct": (
                      raw_hashes["a_manifest"] != raw_hashes["b_manifest"]
                  ),
                  "checkpoint_raw_captures_distinct": (
                      raw_hashes["a_checkpoint"] != raw_hashes["b_checkpoint"]
                  ),
                  "manifest_receipt_equal": (
                      manifest_receipt_hashes[0] == manifest_receipt_hashes[1]
                  ),
                  "checkpoint_receipt_equal": (
                      checkpoint_receipt_hashes[0] == checkpoint_receipt_hashes[1]
                  ),
                  "bundle_v0_2_equal": bundle_hashes[0] == bundle_hashes[1],
                  "witness_decision_equal": (
                      witness_decisions[0]["reason"]
                      == witness_decisions[1]["reason"]
                      and witness_decisions[0]["next_witness_sha256"]
                      == witness_decisions[1]["next_witness_sha256"]
                  ),
              },
          }
          assert all(result["equivalence"].values())
          output = Path(
              "artifacts/normalized-verification-receipt-proof/"
              "normalized-verification-receipt-proof-result.json"
          )
          output.write_bytes(canonical_json_bytes(result))

          print(f"manifest_receipt_sha256={manifest_receipt_hashes[0]}")
          print(f"checkpoint_receipt_sha256={checkpoint_receipt_hashes[0]}")
          print(f"evidence_bundle_v0_2_sha256={bundle_hashes[0]}")
          print(
              "verification_output_representation_independence=VERIFIED"
          )
          PY

      - name: Attest normalized manifest receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/normalized-verification-receipt-proof/receipts/manifest-receipt-a.json

      - name: Attest normalized checkpoint receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/normalized-verification-receipt-proof/receipts/checkpoint-receipt-a.json

      - name: Attest Evidence Bundle v0.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/normalized-verification-receipt-proof/bundles/evidence-bundle-v0.2-a.json

      - name: Attest normalized verification proof result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/normalized-verification-receipt-proof/normalized-verification-receipt-proof-result.json

      - name: Upload normalized verification receipt proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: normalized-verification-receipt-proof
          path: |
            artifacts/normalized-verification-receipt-proof
            verifier-capture-a
            verifier-capture-b
          if-no-files-found: error
          retention-days: 30
