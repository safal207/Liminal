name: Trust Provider Portability Once

on:
  workflow_dispatch:
  push:
    branches:
      - agent/recovery-routing-v0-1
    paths:
      - .github/workflows/trust-provider-portability-once.yml

jobs:
  run-immutable-proof:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: safal207/Liminal/.github/workflows/trust-provider-portability.yml@dc9f236d590f15ee005d2688f91da92460c512d2

  verify-provider-proof-externally:
    needs: run-immutable-proof
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable provider proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: safal207/Liminal
          ref: dc9f236d590f15ee005d2688f91da92460c512d2
          fetch-depth: 0

      - name: Verify immutable provider proof checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dc9f236d590f15ee005d2688f91da92460c512d2"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download provider portability proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trust-provider-portability-proof
          path: provider-proof

      - name: Download immutable producer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-recovery-trust-consumer-checkpoint-attested
          path: source-evidence

      - name: Locate unique producer subjects
        id: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path("source-evidence")
          manifests = sorted(root.rglob("evidence-manifest-v0.1.json"))
          checkpoints = sorted(root.rglob("checkpoint-generation-1.json"))
          assert len(manifests) == 1, manifests
          assert len(checkpoints) == 1, checkpoints
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"manifest={manifests[0].as_posix()}\n")
              output.write(f"checkpoint={checkpoints[0].as_posix()}\n")
          PY

      - name: Independently reverify GitHub Sigstore provider
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ steps.source.outputs.manifest }}
          CHECKPOINT_PATH: ${{ steps.source.outputs.checkpoint }}
        run: |
          set -euo pipefail
          mkdir -p external-verification/github
          gh attestation verify \
            "${MANIFEST_PATH}" \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-trust-consumer-checkpoint-attested.yml \
            --signer-digest f31b56a5e21a668bcb98791b05542652760dcc27 \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > external-verification/github/manifest.json
          gh attestation verify \
            "${CHECKPOINT_PATH}" \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-trust-consumer-checkpoint-attested.yml \
            --signer-digest f31b56a5e21a668bcb98791b05542652760dcc27 \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > external-verification/github/checkpoint.json

      - name: Independently reverify pinned offline Ed25519 provider
        env:
          MANIFEST_PATH: ${{ steps.source.outputs.manifest }}
          CHECKPOINT_PATH: ${{ steps.source.outputs.checkpoint }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          root_dir="trust/experimental/offline-ed25519-root-v0.1"
          expected_root="ed25519-sha256:4b690cae29f41bea47c2beaca52e92dcb606c69638b9f48d8e540a981af1e402"
          actual_root="ed25519-sha256:$(openssl pkey -pubin -in "${root_dir}/public-key.pem" -outform DER | sha256sum | awk '{print $1}')"
          test "${actual_root}" = "${expected_root}"

          mkdir -p external-verification/offline
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("trust/experimental/offline-ed25519-root-v0.1")
          output = Path("external-verification/offline")
          expected_root = "ed25519-sha256:4b690cae29f41bea47c2beaca52e92dcb606c69638b9f48d8e540a981af1e402"
          expected = {
              "authority_id": "liminal:checkpoint-producer",
              "authorization_policy_sha256": "22fcc3c556528d080591041bc10c1a35f85bfbad348b8f669bfff4bb1b88b47f",
              "execution_policy": "trusted-ci-no-self-hosted",
              "producer_revision": "f31b56a5e21a668bcb98791b05542652760dcc27",
              "repository": "safal207/Liminal",
              "schema": "liminal-offline-provider-claim/v0.1",
              "source_ref": os.environ["SOURCE_REF"],
          }
          subjects = {
              "manifest": ("evidence_manifest", Path(os.environ["MANIFEST_PATH"]), root / "manifest-proof.json"),
              "checkpoint": ("checkpoint", Path(os.environ["CHECKPOINT_PATH"]), root / "checkpoint-proof.json"),
          }
          for name, (kind, subject_path, proof_path) in subjects.items():
              proof = json.loads(proof_path.read_text())
              assert proof["root_id"] == expected_root
              claim = proof["claim"]
              for key, value in expected.items():
                  assert claim[key] == value, (name, key, claim[key], value)
              assert claim["subject_kind"] == kind
              assert claim["subject_sha256"] == hashlib.sha256(subject_path.read_bytes()).hexdigest()
              claim_bytes = (json.dumps(claim, sort_keys=True, separators=(",", ":")) + "\n").encode()
              (output / f"{name}.claim.json").write_bytes(claim_bytes)
              (output / f"{name}.sig").write_bytes(base64.b64decode(proof["signature_base64"]))
          PY

          openssl pkeyutl -verify -pubin -inkey "${root_dir}/public-key.pem" -rawin \
            -in external-verification/offline/manifest.claim.json \
            -sigfile external-verification/offline/manifest.sig
          openssl pkeyutl -verify -pubin -inkey "${root_dir}/public-key.pem" -rawin \
            -in external-verification/offline/checkpoint.claim.json \
            -sigfile external-verification/offline/checkpoint.sig

      - name: Independently recompute portable receipts and witness transitions
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          SOURCE_MANIFEST: ${{ steps.source.outputs.manifest }}
          SOURCE_CHECKPOINT: ${{ steps.source.outputs.checkpoint }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from liminal.portable_checkpoint_authorization import (
              PortableCheckpointAuthorizationPolicy,
              adapt_portable_trust_receipt_to_checkpoint_evidence,
          )
          from liminal.recovery_trust_consumer_checkpoint_attested import checkpoint_sha256
          from liminal.recovery_trust_consumer_checkpoint_witness import evaluate_checkpoint_candidate, witness_sha256
          from liminal.recovery_trust_root_registry import canonical_json_bytes
          from liminal.trust_provider_portability import (
              TrustProviderAgreementReason,
              TrustProviderObservation,
              compare_independent_trust_providers,
              portable_trust_receipt_from_observation,
              portable_trust_receipt_sha256,
          )

          repository = "safal207/Liminal"
          authority_id = "liminal:checkpoint-producer"
          revision = "f31b56a5e21a668bcb98791b05542652760dcc27"
          source_ref = os.environ["SOURCE_REF"]
          execution_policy = "trusted-ci-no-self-hosted"
          policy_sha = "22fcc3c556528d080591041bc10c1a35f85bfbad348b8f669bfff4bb1b88b47f"
          offline_root = "ed25519-sha256:4b690cae29f41bea47c2beaca52e92dcb606c69638b9f48d8e540a981af1e402"

          subject_hashes = {
              "manifest": hashlib.sha256(Path(os.environ["SOURCE_MANIFEST"]).read_bytes()).hexdigest(),
              "checkpoint": hashlib.sha256(Path(os.environ["SOURCE_CHECKPOINT"]).read_bytes()).hexdigest(),
          }
          receipts = {}
          receipt_hashes = {}
          for subject, digest in subject_hashes.items():
              primary = TrustProviderObservation(
                  provider="github-sigstore-public-good",
                  verification_scheme="github_attestation",
                  trust_root_id="sigstore-public-good:fulcio-rekor",
                  subject_sha256=digest,
                  authority_id=authority_id,
                  repository=repository,
                  producer_revision=revision,
                  source_ref=source_ref,
                  execution_policy=execution_policy,
                  authorization_policy_sha256=policy_sha,
                  verified=True,
              )
              secondary = TrustProviderObservation(
                  provider="offline-ed25519-ceremony-v0.1",
                  verification_scheme="detached_ed25519",
                  trust_root_id=offline_root,
                  subject_sha256=digest,
                  authority_id=authority_id,
                  repository=repository,
                  producer_revision=revision,
                  source_ref=source_ref,
                  execution_policy=execution_policy,
                  authorization_policy_sha256=policy_sha,
                  verified=True,
              )
              agreement = compare_independent_trust_providers(primary, secondary)
              assert agreement.agreed is True
              assert agreement.reason is TrustProviderAgreementReason.VERIFIED_TRUST_CLAIMS_AGREE
              a = portable_trust_receipt_from_observation(primary)
              b = portable_trust_receipt_from_observation(secondary)
              assert a == b
              assert portable_trust_receipt_sha256(a) == agreement.portable_receipt_sha256
              receipts[subject] = (a, b)
              receipt_hashes[subject] = agreement.portable_receipt_sha256

          proof_root = Path("provider-proof")
          for subject in ("manifest", "checkpoint"):
              github_copies = sorted(proof_root.rglob(f"{subject}-receipt-github.json"))
              offline_copies = sorted(proof_root.rglob(f"{subject}-receipt-offline.json"))
              assert len(github_copies) == 1, github_copies
              assert len(offline_copies) == 1, offline_copies
              assert github_copies[0].read_bytes() == offline_copies[0].read_bytes()
              assert hashlib.sha256(github_copies[0].read_bytes()).hexdigest() == receipt_hashes[subject]

          trusted_witness = json.loads(Path("policies/recovery-trust-consumer-checkpoint-witness-v0.2.json").read_text())
          previous_checkpoint = json.loads(Path("policies/recovery-trust-consumer-checkpoint-v0.2.json").read_text())
          candidate_checkpoint = json.loads(Path(os.environ["SOURCE_CHECKPOINT"]).read_text())
          assert checkpoint_sha256(candidate_checkpoint) == subject_hashes["checkpoint"]
          policy = PortableCheckpointAuthorizationPolicy(
              authority_id=authority_id,
              source_ref=source_ref,
              execution_policy=execution_policy,
              authorization_policy_sha256=policy_sha,
          )
          decisions = []
          for provider, receipt in (
              ("github-sigstore-public-good", receipts["checkpoint"][0]),
              ("offline-ed25519-ceremony-v0.1", receipts["checkpoint"][1]),
          ):
              adapted = adapt_portable_trust_receipt_to_checkpoint_evidence(trusted_witness, receipt, policy)
              assert adapted.authorized and adapted.checkpoint_evidence is not None
              decision = evaluate_checkpoint_candidate(
                  trusted_witness,
                  candidate_checkpoint,
                  previous_checkpoint=previous_checkpoint,
                  checkpoint_evidence=adapted.checkpoint_evidence,
              )
              assert decision.authorized and decision.reason == "checkpoint_witness_advanced"
              assert decision.next_witness is not None
              decisions.append({
                  "provider": provider,
                  "reason": decision.reason,
                  "next_witness_sha256": witness_sha256(decision.next_witness),
              })
          assert decisions[0]["next_witness_sha256"] == decisions[1]["next_witness_sha256"]

          result_files = sorted(proof_root.rglob("trust-provider-portability-result.json"))
          assert len(result_files) == 1, result_files
          proof_result = json.loads(result_files[0].read_text())
          assert proof_result["verified"] is True
          assert proof_result["portable_receipt_sha256"] == receipt_hashes
          assert proof_result["witness_decisions"][0]["next_witness_sha256"] == decisions[0]["next_witness_sha256"]

          external = {
              "schema_version": "liminal.trust-provider-portability.external-verification.v0.1",
              "verified": True,
              "provider_independence": {
                  "trust_root": True,
                  "signing_authority": True,
                  "signature_scheme": True,
                  "ci_provider": False,
                  "artifact_transport": False,
                  "transparency_log": False,
              },
              "portable_receipt_sha256": receipt_hashes,
              "witness_decisions": decisions,
          }
          Path("external-verification/trust-provider-portability-external-verification.json").write_bytes(
              canonical_json_bytes(external)
          )
          print(f"manifest_portable_receipt_sha256={receipt_hashes['manifest']}")
          print(f"checkpoint_portable_receipt_sha256={receipt_hashes['checkpoint']}")
          print(f"next_witness_sha256={decisions[0]['next_witness_sha256']}")
          print("external_trust_provider_verification=VERIFIED")
          PY

      - name: Verify immutable proof signer on both provider receipt copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_subject() {
            local subject="$1"
            gh attestation verify \
              "${subject}" \
              --repo safal207/Liminal \
              --signer-workflow safal207/Liminal/.github/workflows/trust-provider-portability.yml \
              --signer-digest dc9f236d590f15ee005d2688f91da92460c512d2 \
              --source-ref "${{ github.ref }}" \
              --deny-self-hosted-runners
          }
          for subject in manifest checkpoint; do
            github_copy="$(find provider-proof -type f -name "${subject}-receipt-github.json" -print -quit)"
            offline_copy="$(find provider-proof -type f -name "${subject}-receipt-offline.json" -print -quit)"
            test -n "${github_copy}" && test -n "${offline_copy}"
            cmp "${github_copy}" "${offline_copy}"
            verify_subject "${github_copy}"
            verify_subject "${offline_copy}"
          done

      - name: Verify immutable proof signer on result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(find provider-proof -type f -name 'trust-provider-portability-result.json' -print -quit)"
          test -n "${result}"
          gh attestation verify \
            "${result}" \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trust-provider-portability.yml \
            --signer-digest dc9f236d590f15ee005d2688f91da92460c512d2 \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners

      - name: Attest external provider verification result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: external-verification/trust-provider-portability-external-verification.json

      - name: Upload external provider verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trust-provider-portability-external-verification
          path: external-verification
          if-no-files-found: error
          retention-days: 30
