name: Genesis Historical Trust-Base Portability Once

on:
  push:
    branches:
      - agent/recovery-routing-v0-1
    paths:
      - .github/workflows/historical-trust-base-portability-once.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  prove:
    uses: safal207/Liminal/.github/workflows/historical-trust-base-portability.yml@64116d0eea55a874ac7f63b733416df39108d7a7

  audit-independently:
    needs: prove
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable historical portability verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: safal207/Liminal
          ref: 64116d0eea55a874ac7f63b733416df39108d7a7
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download historical portability proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: historical-trust-base-portability-proof-v0.1
          path: proof

      - name: Verify immutable proof result signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            proof/historical-trust-base-portability-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/historical-trust-base-portability.yml \
            --signer-digest 64116d0eea55a874ac7f63b733416df39108d7a7 \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > proof-result-attestation-verification.json

      - name: Reverify bundled Root A signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            proof/materials/root-a/rotation-drill-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-trust-root-rotation-drill.yml \
            --signer-digest e2cb6a014236bc561d03c405f4986146026041fa \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > root-a-attestation-verification.json

      - name: Independently recompute historical portability
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python scripts/audit-historical-trust-base-portability-v0-1.py \
            --proof-dir proof \
            --output audit/historical-trust-base-portability-external-audit.json

      - name: Assert independent audit verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(
              Path(
                  "audit/historical-trust-base-portability-external-audit.json"
              ).read_text()
          )
          assert audit["verified"] is True
          assert audit["reason"] == "historical_trust_base_portability_recomputed"
          print("historical_trust_base_external_audit=VERIFIED")
          PY

      - name: Attest independent audit result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: audit/historical-trust-base-portability-external-audit.json

      - name: Upload independent audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: historical-trust-base-portability-external-audit-v0.1
          path: |
            audit
            proof-result-attestation-verification.json
            root-a-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
