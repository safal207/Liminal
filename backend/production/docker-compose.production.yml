services:
  rgl-core:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Set PYTHON_IMAGE to an immutable python image reference}
    expose:
      - "8000"
    environment:
      ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a strong random value}
      LIMINAL_ADMIN_PASS: ${LIMINAL_ADMIN_PASS:?Set LIMINAL_ADMIN_PASS to a strong bootstrap password}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      USE_REDIS: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      LOG_LEVEL: INFO
      WORKERS: "4"
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  neural-analytics:
    profiles: ["research"]
    image: ${NEURAL_ANALYTICS_IMAGE_REPOSITORY:?Set repository}@${NEURAL_ANALYTICS_IMAGE_DIGEST:?Set sha256 digest}
    expose:
      - "8001"
    environment:
      RGL_CORE_URL: http://rgl-core:8000
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - rgl-core
      - redis
    networks:
      - internal
    restart: unless-stopped

  websocket-gateway:
    profiles: ["gateway"]
    image: ${WEBSOCKET_GATEWAY_IMAGE_REPOSITORY:?Set repository}@${WEBSOCKET_GATEWAY_IMAGE_DIGEST:?Set sha256 digest}
    expose:
      - "8002"
    environment:
      RGL_CORE_URL: http://rgl-core:8000
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      MAX_CONNECTIONS: "10000"
    depends_on:
      - rgl-core
      - redis
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis@${REDIS_IMAGE_DIGEST:?Set REDIS_IMAGE_DIGEST to sha256 digest}
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --maxmemory 512mb
        --maxmemory-policy allkeys-lru --requirepass "$${REDIS_PASSWORD}"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j@${NEO4J_IMAGE_DIGEST:?Set NEO4J_IMAGE_DIGEST to sha256 digest}
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_db_memory_pagecache_size: 512M
      NEO4J_db_memory_heap_initial_size: 512M
      NEO4J_db_memory_heap_max_size: 1G
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus@${PROMETHEUS_IMAGE_DIGEST:?Set PROMETHEUS_IMAGE_DIGEST to sha256 digest}
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - internal
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana@${GRAFANA_IMAGE_DIGEST:?Set GRAFANA_IMAGE_DIGEST to sha256 digest}
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx@${NGINX_IMAGE_DIGEST:?Set NGINX_IMAGE_DIGEST to sha256 digest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - rgl-core
    networks:
      - edge
      - internal
    restart: unless-stopped

  elasticsearch:
    profiles: ["observability"]
    image: docker.elastic.co/elasticsearch/elasticsearch@${ELASTICSEARCH_IMAGE_DIGEST:?Set ELASTICSEARCH_IMAGE_DIGEST to sha256 digest}
    expose:
      - "9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "true"
      # Security auto-configuration is skipped when xpack.security.enabled is explicit.
      # Keep the authenticated HTTP endpoint confined to the internal network.
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:\"$${ELASTIC_PASSWORD}\" http://localhost:9200/_cluster/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch-setup:
    profiles: ["observability"]
    image: docker.elastic.co/elasticsearch/elasticsearch@${ELASTICSEARCH_IMAGE_DIGEST:?Set ELASTICSEARCH_IMAGE_DIGEST to sha256 digest}
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      - bash
      - -euc
      - |
        escaped="$${KIBANA_SYSTEM_PASSWORD//\\/\\\\}"
        escaped="$${escaped//\"/\\\"}"
        printf '{"password":"%s"}' "$${escaped}" |
          curl -fsS --output /dev/null \
            --user "elastic:$${ELASTIC_PASSWORD}" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data-binary @- \
            http://elasticsearch:9200/_security/user/kibana_system/_password
    networks:
      - internal
    restart: "no"

  logstash:
    profiles: ["observability"]
    image: docker.elastic.co/logstash/logstash@${LOGSTASH_IMAGE_DIGEST:?Set LOGSTASH_IMAGE_DIGEST to sha256 digest}
    volumes:
      - ./monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD}
    depends_on:
      - elasticsearch
    networks:
      - internal
    restart: unless-stopped

  kibana:
    profiles: ["observability"]
    image: docker.elastic.co/kibana/kibana@${KIBANA_IMAGE_DIGEST:?Set KIBANA_IMAGE_DIGEST to sha256 digest}
    expose:
      - "5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - internal
    restart: unless-stopped

volumes:
  redis-data:
  neo4j-data:
  neo4j-logs:
  prometheus-data:
  grafana-data:
  elasticsearch-data:

networks:
  edge:
  internal:
    internal: true
