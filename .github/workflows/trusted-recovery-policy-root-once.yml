name: Trusted Recovery Policy Root Once

on:
  push:
    branches:
      - agent/recovery-routing-v0-1
    paths:
      - '.github/workflows/trusted-recovery-policy-root-once.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  call-trusted-proof:
    uses: ./.github/workflows/trusted-recovery-decision-proof.yml
    secrets: inherit

  verify-policy-root-externally:
    needs: call-trusted-proof
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Download immutable verifier authorization artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trusted-recovery-decision-proof-authorization
          path: artifacts/trust-authorization

      - name: Verify immutable verifier policy root with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            artifacts/trust-authorization/recovery-trust-authorization.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-proof-verifier.yml \
            --signer-digest 0aa3dce24f9aeb0c90f955fa5f68d12685e5654a \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > artifacts/trust-authorization/verifier-root-attestation-verification.json

      - name: Upload external policy-root verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-recovery-policy-root-external-verification
          path: artifacts/trust-authorization/verifier-root-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
