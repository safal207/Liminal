name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install deterministic dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
          python -m pip install bandit==1.7.9 pip-audit==2.7.3
          python -m pip check
          python -m pip freeze --all

      - name: Release configuration guard
        run: python scripts/check_release_security.py

      - name: Pre-commit on release-critical files
        run: |
          pre-commit run --show-diff-on-failure --files \
            backend/auth/jwt_utils.py \
            backend/auth/dependencies.py \
            backend/core/settings.py \
            backend/config.py \
            backend/app/services/auth.py \
            backend/app/services/websocket.py \
            backend/app/routes/debug.py \
            backend/tests/test_release_gate_hardening.py \
            tests/test_websocket_integration.py \
            scripts/check_release_security.py \
            tests/load/ws-burst.yml \
            .env.example \
            backend/production/docker-compose.production.yml \
            .github/workflows/python-ci.yml \
            .github/workflows/python-integration.yml \
            .github/workflows/artillery-smoke.yml

      - name: Format and lint release-critical Python files
        run: |
          black --check \
            backend/auth/jwt_utils.py \
            backend/auth/dependencies.py \
            backend/core/settings.py \
            backend/config.py \
            backend/app/services/auth.py \
            backend/app/services/websocket.py \
            backend/app/routes/debug.py \
            backend/tests/test_release_gate_hardening.py \
            tests/test_websocket_integration.py \
            scripts/check_release_security.py
          isort --check-only --profile black \
            backend/auth/jwt_utils.py \
            backend/auth/dependencies.py \
            backend/core/settings.py \
            backend/config.py \
            backend/app/services/auth.py \
            backend/app/services/websocket.py \
            backend/app/routes/debug.py \
            backend/tests/test_release_gate_hardening.py \
            tests/test_websocket_integration.py \
            scripts/check_release_security.py
          flake8 \
            backend/auth/jwt_utils.py \
            backend/auth/dependencies.py \
            backend/core/settings.py \
            backend/config.py \
            backend/app/services/auth.py \
            backend/app/services/websocket.py \
            backend/app/routes/debug.py \
            backend/tests/test_release_gate_hardening.py \
            tests/test_websocket_integration.py \
            scripts/check_release_security.py

      - name: Type-check release-critical files
        run: |
          mypy --ignore-missing-imports --follow-imports=skip \
            backend/auth/jwt_utils.py \
            backend/auth/dependencies.py \
            backend/core/settings.py \
            backend/config.py \
            backend/app/services/auth.py \
            backend/app/services/websocket.py \
            backend/app/routes/debug.py

      - name: Static security analysis
        run: |
          bandit -q -r -ll \
            backend/auth \
            backend/core/settings.py \
            backend/config.py \
            backend/app/services/auth.py \
            backend/app/services/websocket.py \
            backend/app/routes/debug.py \
            -x backend/tests
          pip-audit --strict --skip-editable

      - name: Release-gate negative tests with coverage
        env:
          ENV: test
          JWT_SECRET_KEY: ci-release-gate-secret-0123456789abcdef
        run: |
          export PYTHONPATH="${PWD}:${PYTHONPATH}"
          python -m pytest -q backend/tests/test_release_gate_hardening.py \
            --cov=backend.auth.jwt_utils \
            --cov=backend.auth.dependencies \
            --cov=backend.core.settings \
            --cov=backend.config \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Smoke test agent audit demo runner
        run: |
          python examples/agent_audit_demo/run_demo.py
          python examples/agent_audit_demo/run_demo.py --mode static
          python examples/agent_audit_demo/run_demo.py --mode integrated

      - name: Run unit tests
        env:
          ENV: test
          JWT_SECRET_KEY: ci-unit-test-secret-0123456789abcdef
        run: |
          export PYTHONPATH="${PWD}:${PYTHONPATH}"
          python -m pytest -v --maxfail=1 --durations=10 -m "not integration"

      - name: Smoke test Prometheus metrics registry
        run: python tools/metrics_smoke_test.py
