input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["${ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES}"]
    index => "liminal-%{+YYYY.MM.dd}"
  }
}
