name: Causal Fork Reconciliation Portability Once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/causal-fork-reconciliation-portability-once.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  prove:
    uses: safal207/Liminal/.github/workflows/causal-fork-reconciliation-portability.yml@51894987f038e6c24fadf5b3c2768feda4117d6f

  audit-independently:
    needs: prove
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable fork reconciliation verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: safal207/Liminal
          ref: 51894987f038e6c24fadf5b3c2768feda4117d6f
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download fork reconciliation proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: causal-fork-reconciliation-portability-proof-v0.1
          path: proof

      - name: Verify immutable fork reconciliation signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            proof/causal-fork-reconciliation-portability-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/causal-fork-reconciliation-portability.yml \
            --signer-digest 51894987f038e6c24fadf5b3c2768feda4117d6f \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > fork-result-attestation-verification.json

      - name: Reverify bundled multi-epoch prefix signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            proof/materials/evolution-proof/portable-causal-state-evolution-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/portable-causal-state-evolution.yml \
            --signer-digest 5f5cee5749eaa15814323f563c1544347524d000 \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > evolution-result-attestation-verification.json

      - name: Reverify bundled Branch A signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            proof/materials/branch-a/causal-fork-branch-a-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/causal-fork-branch-a-producer.yml \
            --signer-digest 9ec014179132cb1bf5a6f21275583cd50425c96e \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > branch-a-result-attestation-verification.json

      - name: Independently recompute fork reconciliation
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python scripts/audit-causal-fork-reconciliation-portability-v0-1.py \
            --proof-dir proof \
            --repository-root "${GITHUB_WORKSPACE}" \
            --output audit/causal-fork-reconciliation-portability-external-audit.json

      - name: Assert independent audit verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(
              Path(
                  "audit/causal-fork-reconciliation-portability-external-audit.json"
              ).read_text()
          )
          assert audit["verified"] is True
          assert audit["reason"] == "causal_fork_reconciliation_portability_recomputed"
          assert audit["fork_causal_epoch"] == 3
          assert audit["reconciled_causal_epoch"] == 4
          assert audit["both_lineages_preserved"] is True
          assert audit["raw_evidence_embedded"] is False
          print("causal_fork_reconciliation_external_audit=VERIFIED")
          PY

      - name: Attest independent audit result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: audit/causal-fork-reconciliation-portability-external-audit.json

      - name: Upload independent audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: causal-fork-reconciliation-portability-external-audit-v0.1
          path: |
            audit
            fork-result-attestation-verification.json
            evolution-result-attestation-verification.json
            branch-a-result-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
