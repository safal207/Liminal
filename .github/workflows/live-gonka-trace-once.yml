name: Live Gonka Provider Trace Once

on:
  push:
    branches:
      - agent/recovery-routing-v0-1
    paths:
      - .github/workflows/live-gonka-trace-once.yml

permissions:
  contents: read

jobs:
  live-gonka-trace:
    runs-on: ubuntu-latest
    environment: live-provider-trace
    env:
      GONKA_BROKER_API_KEY: ${{ secrets.GONKA_BROKER_API_KEY }}
      GONKA_BROKER_URL: ${{ secrets.GONKA_BROKER_URL }}
      OPENAI_MOCK_ONLY: "false"
      OPENAI_FALLBACK_TO_LOCAL: "false"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Gonka broker configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GONKA_BROKER_API_KEY:-}" ]; then
            echo "GONKA_BROKER_API_KEY GitHub Secret is required."
            exit 1
          fi
          if [ -z "${GONKA_BROKER_URL:-}" ]; then
            echo "GONKA_BROKER_URL GitHub Secret is required."
            exit 1
          fi

      - name: Install minimal live-trace dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai>=1.30,<3" "httpx>=0.24" "structlog>=23.1"

      - name: Run Gonka nominal live provider trace
        # Retry after backend.ml was made lazy so this probe stays lightweight.
        run: |
          python scripts/run-live-provider-trace.py \
            --provider gonka \
            --model "MiniMaxAI/MiniMax-M2.7" \
            --context-window-tokens "180000" \
            --probe-mode nominal \
            --latency-budget-seconds "20" \
            --output artifacts/live-provider-trace.json

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gonka-provider-trace-once
          path: artifacts/live-provider-trace.json
          if-no-files-found: warn
          retention-days: 14
