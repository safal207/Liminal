name: Repeated Fork Lineage Compaction v0.1

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  produce-predecessor:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: safal207/Liminal/.github/workflows/causal-fork-reconciliation-portability.yml@51894987f038e6c24fadf5b3c2768feda4117d6f

  produce-repeat-branch-a:
    needs: produce-predecessor
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: safal207/Liminal/.github/workflows/repeated-causal-fork-branch-a-producer.yml@cbef175c7aae9325a05ed759ef03894afb11928e

  prove-lineage-compaction:
    needs: [produce-predecessor, produce-repeat-branch-a]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable lineage compaction verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0

      - name: Verify immutable lineage compaction checkout
        env:
          LIMINAL_COMPACTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${LIMINAL_COMPACTION_WORKFLOW_SHA}"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download fresh predecessor fork proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: causal-fork-reconciliation-portability-proof-v0.1
          path: predecessor

      - name: Download fresh repeated Branch A evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repeated-causal-fork-branch-a-evidence-v0.1
          path: branch-a-evidence

      - name: Verify immutable predecessor signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            predecessor/causal-fork-reconciliation-portability-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/causal-fork-reconciliation-portability.yml \
            --signer-digest 51894987f038e6c24fadf5b3c2768feda4117d6f \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > predecessor-attestation-verification.json

      - name: Independently re-audit predecessor fork
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python scripts/audit-causal-fork-reconciliation-portability-v0-1.py \
            --proof-dir predecessor \
            --repository-root "${GITHUB_WORKSPACE}" \
            --output predecessor-external-audit.json

      - name: Verify immutable repeated Branch A signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            branch-a-evidence/branch-a/repeated-causal-fork-branch-a-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/repeated-causal-fork-branch-a-producer.yml \
            --signer-digest cbef175c7aae9325a05ed759ef03894afb11928e \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > repeated-branch-a-attestation-verification.json

      - name: Prove repeated fork lineage compaction
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          LIMINAL_COMPACTION_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python scripts/verify-repeated-fork-lineage-compaction-v0-1.py \
            --predecessor-proof-dir predecessor \
            --predecessor-attestation predecessor-attestation-verification.json \
            --predecessor-audit predecessor-external-audit.json \
            --branch-a-dir branch-a-evidence/branch-a \
            --branch-a-attestation repeated-branch-a-attestation-verification.json \
            --branch-a-workflow-sha cbef175c7aae9325a05ed759ef03894afb11928e \
            --branch-b-dir trust/experimental/repeated-causal-fork-branch-b-v0.1 \
            --branch-a-policy policies/portable-repeated-causal-fork-state-a-v0.1.json \
            --branch-b-policy policies/portable-repeated-causal-fork-state-b-v0.1.json \
            --reconciliation-policy policies/portable-repeated-causal-reconciled-state-v0.1.json \
            --branch-contract policies/portable-repeated-causal-fork-branch-contract-v0.1.json \
            --branch-authorization-contract policies/portable-repeated-causal-fork-authorization-contract-v0.1.json \
            --reconciliation-contract policies/portable-repeated-causal-reconciliation-contract-v0.1.json \
            --reconciliation-authorization-contract policies/portable-repeated-causal-reconciliation-authorization-contract-v0.1.json \
            --lineage-compaction-contract policies/portable-causal-lineage-compaction-contract-v0.1.json \
            --repository-root "${GITHUB_WORKSPACE}" \
            --workflow-sha "${LIMINAL_COMPACTION_WORKFLOW_SHA}" \
            --output-dir artifacts/repeated-fork-lineage-compaction

      - name: Assert repeated compaction verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "artifacts/repeated-fork-lineage-compaction/repeated-fork-lineage-compaction-result.json"
              ).read_text()
          )
          receipt = result["receipt"]
          assert result["verified"] is True
          assert result["reason"] == "repeated_fork_lineage_compaction_verified"
          assert receipt["reconciliation_count"] == 2
          assert receipt["total_branch_event_count"] == 4
          assert receipt["common_tip_causal_epoch"] == 4
          assert receipt["fork_causal_epoch"] == 5
          assert receipt["reconciled_causal_epoch"] == 6
          assert receipt["bounded_accumulator_shape"] is True
          assert receipt["previous_accumulator_bytes"] == receipt["current_accumulator_bytes"]
          assert result["claim_boundary"]["predecessor_raw_proof_embedded_in_compact_result"] is False
          assert result["claim_boundary"]["branch_a_github_oidc_attestation_verified"] is True
          assert result["claim_boundary"]["branch_b_detached_ed25519_signature_verified"] is True
          print("repeated_fork_lineage_compaction=VERIFIED")
          PY

      - name: Attest repeated compaction result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/repeated-fork-lineage-compaction/repeated-fork-lineage-compaction-result.json

      - name: Upload repeated compaction proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repeated-fork-lineage-compaction-proof-v0.1
          path: artifacts/repeated-fork-lineage-compaction
          if-no-files-found: error
          retention-days: 30
