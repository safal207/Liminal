name: Portable Causal Evolution Path A Producer v0.1

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  produce-path-a:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout immutable Path A producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0

      - name: Verify immutable Path A producer checkout
        env:
          LIMINAL_PATH_A_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${LIMINAL_PATH_A_WORKFLOW_SHA}" || {
            echo "Path A producer checkout mismatch"
            exit 1
          }

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Download portable epoch-0 anchor proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: downstream-causal-state-portability-proof-v0.1
          path: anchor

      - name: Verify immutable anchor proof signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            anchor/downstream-causal-state-portability-result.json \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/downstream-causal-state-portability.yml \
            --signer-digest 65140882f172c53b6556ce9aa7a190f40bacc3bf \
            --source-ref "${{ github.ref }}" \
            --deny-self-hosted-runners \
            --format json \
            > anchor-attestation-verification.json

      - name: Produce Root A causal evolution history
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          LIMINAL_PATH_A_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python scripts/produce-causal-evolution-path-a-v0-1.py \
            --downstream-proof-dir anchor \
            --policy-step-1 policies/portable-causal-evolution-state-step-1-v0.1.json \
            --policy-step-2 policies/portable-causal-evolution-state-step-2-v0.1.json \
            --transition-contract policies/portable-causal-evolution-transition-contract-v0.1.json \
            --transition-authorization-contract policies/portable-causal-evolution-transition-authorization-contract-v0.1.json \
            --rotation-contract policies/portable-rotation-producer-contract-v0.1.json \
            --historical-authorization-contract policies/portable-rotation-authorization-contract-v0.1.json \
            --workflow-sha "${LIMINAL_PATH_A_WORKFLOW_SHA}" \
            --output-dir path-a

      - name: Assert Root A evolution verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("path-a/path-a-causal-evolution-result.json").read_text())
          assert result["verified"] is True
          assert result["reason"] == "root_a_causal_evolution_history_verified"
          assert len(result["transition_sequence"]) == 2
          first, second = result["transition_sequence"]
          assert (first["from_history_generation"], first["to_history_generation"]) == (1, 3)
          assert (second["from_history_generation"], second["to_history_generation"]) == (3, 4)
          assert result["claim_boundary"]["registry_chain_validated"] is True
          assert result["claim_boundary"]["semantic_noop_generation_present"] is True
          print("root_a_causal_evolution_history=VERIFIED")
          PY

      - name: Attest Root A causal evolution result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: path-a/path-a-causal-evolution-result.json

      - name: Upload Root A causal evolution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-causal-evolution-path-a-v0.1
          path: |
            path-a
            anchor-attestation-verification.json
          if-no-files-found: error
          retention-days: 30
