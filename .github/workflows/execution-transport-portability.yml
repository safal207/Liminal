name: Execution Transport Portability

on:
  workflow_call:
    inputs:
      execution_transport_workflow_sha:
        description: Immutable SHA containing this reusable proof workflow
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  prove-execution-transport-portability:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "31658743875"
      SOURCE_ARTIFACT_NAME: trusted-recovery-trust-consumer-checkpoint-attested
      SOURCE_ARTIFACT_ID: "9165388614"
      EXPECTED_SOURCE_ZIP_SHA256: c3822f1d5658d4c9965a67b1a4264dafc04cb5ea6f64c516ced7a920b49cd161
      EXPECTED_CHECKPOINT_SHA256: 74096c48cd730c55dd2f486f1af4b211b4f7f1ce38613134be645055ff1f946a
      EXPECTED_TRUST_RECEIPT_SHA256: 2235b07a4188628091cbe94af6a16dc30516d0acea743f9b4517b58a5cbd1a80
      EXPECTED_AUTHORIZATION_POLICY_SHA256: 22fcc3c556528d080591041bc10c1a35f85bfbad348b8f669bfff4bb1b88b47f
      EXPECTED_NEXT_WITNESS_SHA256: cc389524836b013bb5a416f0a9f6647d9ff252d2de79598e4df119c6e5760d2f
      EXPECTED_EXECUTION_TRANSPORT_RECEIPT_SHA256: 644b575189d18d61e7ed8415d59087c69d0ddc02ba5743b24c86dfacc7b24b49
      EXTERNAL_RESULT_SHA256: 70d9413ef99348ab495b4fe173cba9493372ec9ee25a4ac5deb64a5b9c94a979
      EXTERNAL_ROOT_ID: ed25519-sha256:72c2477f78a0a901f6f1cef45ccec69053842eb980c666f0cbdc01589dcd69d9
      EXTERNAL_DRIVE_FILE_ID: 1wLKINhrx6BGilKvUKI_OZQLOV5oEiDdN
      PRODUCER_SHA: f31b56a5e21a668bcb98791b05542652760dcc27
      SOURCE_REF: refs/heads/agent/recovery-routing-v0-1

    steps:
      - name: Checkout immutable execution-transport proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.execution_transport_workflow_sha }}
          fetch-depth: 0

      - name: Verify immutable workflow checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.execution_transport_workflow_sha }}"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
          check-latest: false

      - name: Download immutable source evidence through GitHub artifact transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-evidence
          gh run download "${SOURCE_RUN_ID}" \
            --repo safal207/Liminal \
            --name "${SOURCE_ARTIFACT_NAME}" \
            --dir source-evidence

      - name: Locate unique checkpoint subject
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path("source-evidence")
          checkpoints = sorted(root.rglob("checkpoint-generation-1.json"))
          assert len(checkpoints) == 1, checkpoints
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checkpoint={checkpoints[0].as_posix()}\n")
          PY

      - name: Reverify GitHub Sigstore primary path
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_PATH: ${{ steps.locate.outputs.checkpoint }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "${CHECKPOINT_PATH}" | awk '{print $1}')" = "${EXPECTED_CHECKPOINT_SHA256}"
          gh attestation verify \
            "${CHECKPOINT_PATH}" \
            --repo safal207/Liminal \
            --signer-workflow safal207/Liminal/.github/workflows/trusted-recovery-trust-consumer-checkpoint-attested.yml \
            --signer-digest "${PRODUCER_SHA}" \
            --source-ref "${SOURCE_REF}" \
            --deny-self-hosted-runners

      - name: Verify signed non-GitHub execution path
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="trust/experimental/execution-transport-external-v0.1"
          actual_root="ed25519-sha256:$(openssl pkey -pubin -in "${proof_dir}/public-key.pem" -outform DER | sha256sum | awk '{print $1}')"
          test "${actual_root}" = "${EXTERNAL_ROOT_ID}"

          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          root = Path("trust/experimental/execution-transport-external-v0.1")
          proof = json.loads((root / "proof.json").read_text())
          result_bytes = (root / "result.json").read_bytes()
          canonical_result = (
              json.dumps(proof["result"], sort_keys=True, separators=(",", ":")) + "\n"
          ).encode()
          assert canonical_result == result_bytes
          assert hashlib.sha256(result_bytes).hexdigest() == proof["result_sha256"]
          assert proof["result_sha256"] == "70d9413ef99348ab495b4fe173cba9493372ec9ee25a4ac5deb64a5b9c94a979"
          assert proof["root_id"] == "ed25519-sha256:72c2477f78a0a901f6f1cef45ccec69053842eb980c666f0cbdc01589dcd69d9"
          (root / "result.sig").write_bytes(base64.b64decode(proof["signature_base64"]))
          PY

          openssl pkeyutl -verify -pubin \
            -inkey "${proof_dir}/public-key.pem" \
            -rawin \
            -in "${proof_dir}/result.json" \
            -sigfile "${proof_dir}/result.sig"

      - name: Recompute primary transition and compare independent paths
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          CHECKPOINT_PATH: ${{ steps.locate.outputs.checkpoint }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from liminal.execution_transport_portability import (
              ExecutionTransportAgreementReason,
              ExecutionTransportObservation,
              compare_independent_execution_transport_paths,
              portable_execution_transport_receipt_sha256,
              portable_execution_transport_receipt_from_observation,
          )
          from liminal.portable_checkpoint_authorization import (
              PortableCheckpointAuthorizationPolicy,
              adapt_portable_trust_receipt_to_checkpoint_evidence,
          )
          from liminal.recovery_trust_consumer_checkpoint_witness import (
              evaluate_checkpoint_candidate,
              witness_sha256,
          )
          from liminal.recovery_trust_root_registry import canonical_json_bytes
          from liminal.trust_provider_portability import (
              TrustProviderObservation,
              portable_trust_receipt_from_observation,
              portable_trust_receipt_sha256,
          )

          checkpoint_path = Path(os.environ["CHECKPOINT_PATH"])
          checkpoint_bytes = checkpoint_path.read_bytes()
          checkpoint_sha = hashlib.sha256(checkpoint_bytes).hexdigest()
          assert checkpoint_sha == os.environ["EXPECTED_CHECKPOINT_SHA256"]
          checkpoint = json.loads(checkpoint_bytes)

          provider_observation = TrustProviderObservation(
              provider="github-sigstore-public-good",
              verification_scheme="github_attestation",
              trust_root_id="sigstore-public-good:fulcio-rekor",
              subject_sha256=checkpoint_sha,
              authority_id="liminal:checkpoint-producer",
              repository="safal207/Liminal",
              producer_revision=os.environ["PRODUCER_SHA"],
              source_ref=os.environ["SOURCE_REF"],
              execution_policy="trusted-ci-no-self-hosted",
              authorization_policy_sha256=os.environ[
                  "EXPECTED_AUTHORIZATION_POLICY_SHA256"
              ],
              verified=True,
          )
          trust_receipt = portable_trust_receipt_from_observation(provider_observation)
          trust_receipt_sha = portable_trust_receipt_sha256(trust_receipt)
          assert trust_receipt_sha == os.environ["EXPECTED_TRUST_RECEIPT_SHA256"]

          trusted_witness = json.loads(
              Path("policies/recovery-trust-consumer-checkpoint-witness-v0.2.json").read_text()
          )
          previous_checkpoint = json.loads(
              Path("policies/recovery-trust-consumer-checkpoint-v0.2.json").read_text()
          )
          policy = PortableCheckpointAuthorizationPolicy(
              authority_id="liminal:checkpoint-producer",
              source_ref=os.environ["SOURCE_REF"],
              execution_policy="trusted-ci-no-self-hosted",
              authorization_policy_sha256=os.environ[
                  "EXPECTED_AUTHORIZATION_POLICY_SHA256"
              ],
          )
          adapted = adapt_portable_trust_receipt_to_checkpoint_evidence(
              trusted_witness,
              trust_receipt,
              policy,
          )
          assert adapted.authorized is True, adapted.reason
          assert adapted.checkpoint_evidence is not None
          decision = evaluate_checkpoint_candidate(
              trusted_witness,
              checkpoint,
              previous_checkpoint=previous_checkpoint,
              checkpoint_evidence=adapted.checkpoint_evidence,
          )
          assert decision.authorized is True, decision.reason
          assert decision.reason == "checkpoint_witness_advanced"
          assert decision.next_witness is not None
          next_witness_sha = witness_sha256(decision.next_witness)
          assert next_witness_sha == os.environ["EXPECTED_NEXT_WITNESS_SHA256"]

          external_root = Path("trust/experimental/execution-transport-external-v0.1")
          external = json.loads((external_root / "result.json").read_text())
          assert external["verified"] is True
          assert external["execution_provider"] == "openai-chatgpt-workspace"
          assert external["transport_provider"] == "google-drive"
          assert external["transport_file_id"] == os.environ["EXTERNAL_DRIVE_FILE_ID"]
          assert external["source_github_artifact_id"] == int(os.environ["SOURCE_ARTIFACT_ID"])
          assert external["drive_roundtrip_zip_sha256"] == os.environ[
              "EXPECTED_SOURCE_ZIP_SHA256"
          ]

          primary = ExecutionTransportObservation(
              execution_provider="github-actions-hosted",
              execution_environment_id=(
                  f"github-hosted:{os.environ.get('RUNNER_OS', 'Linux')}:"
                  f"{os.environ.get('RUNNER_ARCH', 'X64')}"
              ),
              transport_provider="github-actions-artifact",
              transport_channel_id=(
                  f"github-run:{os.environ['SOURCE_RUN_ID']}:artifact:"
                  f"{os.environ['SOURCE_ARTIFACT_ID']}"
              ),
              subject_sha256=checkpoint_sha,
              portable_trust_receipt_sha256=trust_receipt_sha,
              authorization_policy_sha256=os.environ[
                  "EXPECTED_AUTHORIZATION_POLICY_SHA256"
              ],
              witness_reason=decision.reason,
              next_witness_sha256=next_witness_sha,
              verified=True,
          )
          secondary = ExecutionTransportObservation(
              execution_provider=external["execution_provider"],
              execution_environment_id=external["execution_environment_id"],
              transport_provider=external["transport_provider"],
              transport_channel_id=f"google-drive:{external['transport_file_id']}",
              subject_sha256=external["checkpoint_subject_sha256"],
              portable_trust_receipt_sha256=external[
                  "portable_trust_receipt_sha256"
              ],
              authorization_policy_sha256=external[
                  "authorization_policy_sha256"
              ],
              witness_reason=external["witness_reason"],
              next_witness_sha256=external["next_witness_sha256"],
              verified=external["verified"],
          )
          agreement = compare_independent_execution_transport_paths(primary, secondary)
          assert agreement.agreed is True, agreement.reason
          assert (
              agreement.reason
              is ExecutionTransportAgreementReason.VERIFIED_EXECUTION_TRANSPORT_CLAIMS_AGREE
          )
          assert agreement.portable_receipt_sha256 == os.environ[
              "EXPECTED_EXECUTION_TRANSPORT_RECEIPT_SHA256"
          ]
          assert portable_execution_transport_receipt_sha256(
              portable_execution_transport_receipt_from_observation(primary)
          ) == os.environ["EXPECTED_EXECUTION_TRANSPORT_RECEIPT_SHA256"]

          result = {
              "schema_version": "liminal.execution-transport-portability.v0.1",
              "verified": True,
              "reason": agreement.reason.value,
              "claim_boundary": (
                  "independent execution provider and evidence transport provider; "
                  "shared GitHub source producer and repository metadata"
              ),
              "primary": {
                  "execution_provider": primary.execution_provider,
                  "transport_provider": primary.transport_provider,
                  "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
                  "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              },
              "secondary": {
                  "execution_provider": secondary.execution_provider,
                  "transport_provider": secondary.transport_provider,
                  "transport_file_id": external["transport_file_id"],
                  "external_result_sha256": os.environ["EXTERNAL_RESULT_SHA256"],
                  "external_root_id": os.environ["EXTERNAL_ROOT_ID"],
              },
              "checkpoint_subject_sha256": checkpoint_sha,
              "portable_trust_receipt_sha256": trust_receipt_sha,
              "authorization_policy_sha256": os.environ[
                  "EXPECTED_AUTHORIZATION_POLICY_SHA256"
              ],
              "witness_reason": decision.reason,
              "next_witness_sha256": next_witness_sha,
              "portable_execution_transport_receipt_sha256": (
                  agreement.portable_receipt_sha256
              ),
          }
          output = Path("artifacts/execution-transport-portability")
          output.mkdir(parents=True, exist_ok=True)
          result_path = output / "execution-transport-portability-result.json"
          result_path.write_bytes(canonical_json_bytes(result))
          print(
              "execution_transport_receipt_sha256="
              + str(agreement.portable_receipt_sha256)
          )
          print("next_witness_sha256=" + next_witness_sha)
          print("execution_transport_portability=VERIFIED")
          PY

      - name: Attest execution-transport portability result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/execution-transport-portability/execution-transport-portability-result.json

      - name: Upload execution-transport portability proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-transport-portability-proof
          path: |
            artifacts/execution-transport-portability
            trust/experimental/execution-transport-external-v0.1
          if-no-files-found: error
          retention-days: 30
